<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>try{var d=document.documentElement,t=localStorage.getItem("hw-theme")||"light";if(t==="auto")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.setAttribute("data-theme",t);if(localStorage.getItem("hw-lang")==="en"){d.lang="en";d.dir="ltr"}}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="HIGHWAY Driver App — تطبيق كباتن HIGHWAY Delivery">
<title>HIGHWAY Driver App</title>
<meta name="theme-color" content="#25CED1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HW Driver">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css?v=66">
<link rel="stylesheet" href="styles.css?v=66">
<link rel="stylesheet" href="map.css?v=66">
<link rel="stylesheet" href="theme.css?v=66">
<link rel="stylesheet" href="dark.css?v=66">
</head>
<body>

<div class="ambient"></div>

<!-- الشاشة الافتتاحية + تسجيل الدخول (الإطار الزجاجي نفسه يكبر) -->
<div id="splash">
  <div class="splash-icons" id="splashIcons"></div>
  <div class="splash-content">
    <div class="splash-logo-wrap" id="splashCard">
      <div class="logo-stage">
        <video class="splash-video" id="splashVideo" autoplay muted playsinline preload="auto" aria-hidden="true">
          <source src="splash-intro.mp4?v=23" type="video/mp4">
          <source src="splash-intro.webm?v=23" type="video/webm">
        </video>
        <canvas class="splash-canvas" id="splashCanvas" width="1080" height="530" role="img" aria-label="HIGHWAY Delivery"></canvas>
        <img class="splash-fallback" src="splash-logo-final.png?v=23" alt="" width="1080" height="530" aria-hidden="true">
        <button class="login-back" id="loginBack" type="button" onclick="closeLogin()" aria-label="رجوع للشاشة الرئيسية" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <div class="login-panel" id="loginPanel" aria-hidden="true">
        <div class="login-clip">
          <form class="login-form" id="loginForm" novalidate autocomplete="on">
            <h1>أهلًا يا كابتن</h1>
            <p class="login-sub">سجّل دخولك برقمك والرمز السري</p>

            <div class="field" id="loginUserField">
              <label for="loginUser">رقم الهاتف</label>
              <input type="tel" id="loginUser" name="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="07XXXXXXXX" tabindex="-1">
            </div>
            <div class="field" id="loginPassField">
              <label for="loginPass">الرمز السري</label>
              <input type="password" id="loginPass" name="pin" inputmode="numeric" autocomplete="current-password" dir="ltr" placeholder="••••" tabindex="-1">
            </div>
            <div class="login-error" id="loginError" role="alert"></div>

            <button type="submit" class="submit-btn" id="loginBtn" tabindex="-1">
              <span class="spinner"><i></i><i></i></span>
              <span class="btn-label">دخول</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="splash-extras" id="splashExtras">
      <div class="splash-extras-in"><div class="splash-extras-pad">
        <div class="splash-tagline">اكسب مع كل توصيلة</div>
        <div class="splash-status">
          <span>جاري تجهيز الطلبات القريبة</span>
          <span class="dot-flow"><span></span><span></span><span></span></span>
        </div>
        <button class="splash-enter" id="enterBtn" type="button">ابدأ ←</button>
      </div></div>
    </div>
  </div>
</div>

<div class="app-shell" id="appShell">
  <header class="app-header">
    <button class="header-back" id="headerBack" type="button" aria-label="رجوع" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="brand-mini" type="button" onclick="tabGo('screen-jobs')">
      <img class="brand-mini-logo" src="logo-icon.png" alt="" width="647" height="560">
      <div class="brand-mini-text"><span class="brand-mini-title">HIGHWAY <em>Driver</em></span><span class="brand-mini-sub" id="hdrSub">Driver App</span></div>
    </button>
    <span class="net-dot" id="netDot" title="الحالة"></span>
  </header>
  <main class="main">
    <section class="screen active" id="screen-jobs"><div class="container">
      <div class="demo-banner" id="demoBanner" style="display:none;">نسخة تجريبية: الطلبات تُحفظ على هذا الجهاز فقط</div>
      <div class="online-card" id="onlineCard"></div>
      <div id="shiftBox"></div>
      <div class="home-map" id="actMap"><div class="lmap" id="actMapEl"></div>
        <span class="map-lbl" id="mapLbl">جاري تحديد موقعك…</span>
        <button type="button" class="map-heat" id="heatBtn" onclick="toggleHeat()">مناطق الطلب</button>
        <button type="button" class="map-me" onclick="recenter()" aria-label="موقعي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      </div>
      <div id="activeBox"></div>
      <div id="offersBox"></div>
    </div></section>
    <section class="screen" id="screen-job"><div class="container" id="jobBody"></div></section>
    <section class="screen" id="screen-earn"><div class="container">
      <div class="page-heading"><h1>أرباحي</h1><p>حسابك الكامل مع الشركة</p></div>
      <div class="chips" id="earnChips"></div>
      <div id="earnBody"></div>
    </div></section>
    <section class="screen" id="screen-profile"><div class="container">
      <article class="pf-card"><div class="pf-cover"></div><div class="pf-body">
        <div class="pf-avatar-wrap"><span class="pf-initial" id="pfInitial">؟</span></div>
        <h1 class="pf-name" id="pfName"></h1><p class="pf-handle" id="pfPhone" dir="ltr"></p><span class="pf-chip">كابتن HIGHWAY</span>
      </div></article>
      <div class="pf-list">
        <div class="pf-row"><span class="pf-k">تقييمك من العملاء</span><span class="pf-v" id="pfRate">—</span></div>
        <button class="pf-row pf-link" type="button" onclick="toggleGps()"><span class="pf-k">مشاركة موقعي مع مركز العمليات</span><span class="pf-v" id="pfGps">تعمل وأنت متصل</span></button>
        <a class="pf-row pf-link" href="https://wa.me/962791819432" target="_blank" rel="noopener"><span class="pf-k">الدعم</span></a>
      </div>
      <button class="pf-logout" type="button" onclick="logout()">تسجيل الخروج</button>
    </div></section>
  </main>
  <div class="live-bar" id="liveBar" onclick="tabGo('screen-jobs')"><div class="lv-top"><span class="lv-dot"></span><div class="lv-txt"><b id="lvTitle"></b><small id="lvSub"></small></div></div></div>
  <nav class="tabbar" aria-label="التنقل الرئيسي">
    <button class="tab on" type="button" data-tab="jobs" onclick="tabGo('screen-jobs')"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg><em class="tb" id="tabBadge"></em></span><span>الطلبات</span></button>
    <button class="tab" type="button" data-tab="earn" onclick="tabGo('screen-earn')"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/></svg></span><span>أرباحي</span></button>
    <button class="tab" type="button" data-tab="profile" onclick="tabGo('screen-profile')"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span>حسابي</span></button>
  </nav>
</div>
<div id="sheet" class="modal" onclick="if(event.target===this) closeSheet()"><div class="modal-card glass" id="sheetBody"></div></div>
<script src="leaflet.js?v=66"></script>
<script src="hw-i18n.js?v=66"></script>
<script src="hw-config.js?v=66"></script>
<script src="hw-map.js?v=66"></script>
<script src="hw-food.js?v=66"></script>
<script src="hw-orders.js?v=66"></script>
<script src="hw-notify.js?v=66"></script>
<script src="hw-push.js?v=66"></script>
<script src="hw-biz.js?v=66"></script>
<script src="hw-demo.js?v=66"></script>
<script src="script.js?v=66"></script>
<script src="hw-ui.js?v=66"></script>
</body>
</html>
